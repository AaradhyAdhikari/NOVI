<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Novi Stage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#041a20; --grid:rgba(64,224,255,.24); --glow:#3fe0ff; --ink:#e8fbff; --dim:#8fc7d3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:15px/1.4 "Segoe UI Variable","Segoe UI",system-ui,sans-serif; cursor:default; }
  /* The glowing floor grid, tilted away like a hologram table. */
  .floor { position:fixed; inset:-40% -20% -10%; transform:perspective(900px) rotateX(58deg); transform-origin:50% 100%;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:64px 64px; animation:drift 14s linear infinite; mask-image:linear-gradient(to top,#000 30%,transparent 85%); }
  @keyframes drift { to { background-position:0 64px,0 0; } }
  /* A faint grid on the back wall too, like the reel's hologram room. */
  .back { position:fixed; inset:0; background-image:linear-gradient(rgba(64,224,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(64,224,255,.07) 1px,transparent 1px);
    background-size:64px 64px; mask-image:linear-gradient(to bottom,#000 10%,transparent 70%); pointer-events:none; }
  .wall { position:fixed; inset:0; background:
    radial-gradient(ellipse 60% 45% at 50% 38%,rgba(63,224,255,.16),transparent 70%),
    radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.6),transparent 60%); pointer-events:none; }
  .brand { position:fixed; top:22px; left:28px; font-weight:600; letter-spacing:.32em; font-size:14px; color:var(--glow); text-shadow:0 0 14px rgba(63,224,255,.7); }
  .tag { position:fixed; bottom:26px; width:100%; text-align:center; font-family:Georgia,serif; font-size:20px; color:var(--dim); letter-spacing:.02em; }
  .close { position:fixed; top:18px; right:22px; border:1px solid rgba(63,224,255,.35); background:rgba(4,26,32,.6); color:var(--dim); border-radius:20px; padding:6px 14px; font:inherit; font-size:13px; cursor:pointer; }
  .close:hover { color:var(--ink); border-color:var(--glow); }
  .wait { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center; color:var(--dim); transition:opacity .5s; }
  .ring { width:120px; height:120px; margin:0 auto 18px; border-radius:50%; border:2px solid rgba(63,224,255,.5); box-shadow:0 0 30px rgba(63,224,255,.35),inset 0 0 30px rgba(63,224,255,.2); animation:pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.12); opacity:.55; } }
  .stack { position:fixed; inset:0; perspective:1400px; }
  .card { position:absolute; left:50%; top:44%; width:300px; border-radius:18px; overflow:hidden; cursor:pointer;
    background:linear-gradient(160deg,rgba(18,58,70,.95),rgba(6,30,38,.95)); border:1px solid rgba(63,224,255,.35);
    box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 26px rgba(63,224,255,.28);
    transition:transform .9s cubic-bezier(.2,.9,.25,1.05),opacity .6s,filter .6s; will-change:transform; }
  .card:hover { box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 40px rgba(63,224,255,.6); }
  .card img,.card video { display:block; width:100%; max-height:380px; object-fit:cover; background:#021015; }
  .meta { padding:12px 14px 14px; }
  .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .icon { height:170px; display:grid; place-items:center; font-size:62px; background:radial-gradient(circle at 50% 40%,rgba(63,224,255,.22),transparent 70%); }
  .flash { position:fixed; left:50%; bottom:-40px; width:260px; height:260px; margin-left:-130px; border-radius:50%; background:radial-gradient(circle,rgba(63,224,255,.55),transparent 65%); opacity:0; pointer-events:none; }
  .flash.on { animation:flash .9s ease-out; }
  @keyframes flash { 0% { opacity:.9; transform:scale(.4); } 100% { opacity:0; transform:scale(2.4) translateY(-120px); } }
</style></head>
<body>
<div class="back"></div><div class="floor"></div><div class="wall"></div>
<div class="brand">NOVI</div>
<button class="close" id="close" title="Esc">Close · Esc</button>
<div class="wait" id="wait"><div class="ring"></div>Flick something from your phone</div>
<div class="stack" id="stack"></div>
<div class="flash" id="flash"></div>
<div class="tag">Create the things you wish existed.</div>
<script>
const stack = document.getElementById('stack');
const cards = []; // newest last
const ICON = { doc:'📄', file:'📦', program:'⚙️', link:'🔗', video:'▶️' };
const post = (p) => fetch(p, // relative: the stage lives under its own secret path
  { method:'POST', headers:{ 'x-novi-stage':'1' } }).catch(() => {});

function el(item) {
  const c = document.createElement('div');
  c.className = 'card';
  if (item.preview && item.kind === 'photo') {
    const img = new Image(); img.src = `file/${item.id}`; img.alt = item.name; c.appendChild(img);
  } else if (item.preview && item.kind === 'video') {
    const v = document.createElement('video'); v.src = `file/${item.id}`; v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; c.appendChild(v);
  } else {
    const i = document.createElement('div'); i.className = 'icon'; i.textContent = ICON[item.kind] || '📦'; c.appendChild(i);
  }
  const m = document.createElement('div'); m.className = 'meta';
  const n = document.createElement('div'); n.className = 'name'; n.textContent = item.name;
  const s = document.createElement('div'); s.className = 'sub';
  s.textContent = item.kind === 'link' || (item.kind === 'video' && !item.preview) ? `${item.host} · opening on the laptop` : item.openable ? 'tap to open' : 'saved in Novi Flick · open it yourself';
  m.append(n, s); c.appendChild(m);
  c.addEventListener('click', () => post(`open/${item.id}`));
  return c;
}

// Fan the stack: newest in front and centre, older ones tilt back to the left, oldest fade.
function layout() {
  const n = cards.length;
  cards.forEach((c, i) => {
    const back = n - 1 - i;
    const x = -back * 120, z = -back * 160, ry = back ? 18 : -6, rz = back ? -3 - back : 2;
    c.style.transform = `translate(-50%,-50%) translate3d(${x}px,${-back * 14}px,${z}px) rotateY(${ry}deg) rotateZ(${rz}deg)`;
    c.style.opacity = back > 5 ? 0 : 1 - back * 0.12;
    c.style.filter = back ? `brightness(${1 - back * 0.1})` : 'none';
    c.style.zIndex = 100 - back;
  });
}

function land(item, animate = true) {
  document.getElementById('wait').style.opacity = 0;
  const c = el(item);
  // Start below the screen, as if thrown up from the phone, then fly into place.
  c.style.transform = animate ? 'translate(-50%,-50%) translate3d(0,110vh,300px) rotateX(-55deg) rotateZ(-12deg) scale(.6)' : '';
  stack.appendChild(c);
  cards.push(c);
  while (cards.length > 12) cards.shift().remove();
  if (animate) {
    const f = document.getElementById('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
    requestAnimationFrame(() => requestAnimationFrame(layout));
  } else layout();
}

const es = new EventSource('events');
es.addEventListener('hello', (e) => JSON.parse(e.data).forEach((it) => land(it, false)));
es.addEventListener('item', (e) => land(JSON.parse(e.data)));
es.addEventListener('bye', () => window.close());
const leave = () => { post('close'); setTimeout(() => window.close(), 150); };
document.getElementById('close').addEventListener('click', leave);
addEventListener('keydown', (e) => { if (e.key === 'Escape') leave(); });
</script>
</body></html>
